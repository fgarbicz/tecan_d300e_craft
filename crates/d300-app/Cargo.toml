[package]
name = "d300-designer"
version = "0.1.0"
edition = "2021"
description = "Desktop protocol designer for the Tecan D300e dispenser (clean-room, D300e Control 4.0.1 compatible .tdd files)"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
d300-core = { path = "../d300-core" }
