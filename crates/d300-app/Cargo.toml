[package]
name = "d300-designer"
version = "0.1.0"
edition = "2021"
description = "Desktop protocol designer for the Tecan D300e dispenser (clean-room, D300e Control 4.0.1 compatible .tdd files)"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact decimal → f64 parsing. Without it serde_json may land 1 ulp off (seen in the
# xlsx round-trip check, tools/xlsx_check), and Tauri's IPC decodes command arguments with serde_json.
serde_json = { version = "1", features = ["float_roundtrip"] }
d300-core = { path = "../d300-core" }
# .xlsx export of readout analyses (save_xlsx). Exact pin: the writer's API shifts between 0.x releases.
rust_xlsxwriter = "=0.102.0"
